# git-cliff: CHANGELOG.md by tasks (section 12 of GIT STRATEGY).
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for id, commits in commits | group_by(attribute="scope") %}{% if id is matching("^[A-Z]+-[0-9]+$") %}
### {{ id | replace_regex(from="-0+", to="-") }}
{% for c in commits %}- {{ c.group }}: {{ c.message | upper_first }}
{% endfor %}{% endif %}{% endfor %}{% set other = [] %}{% for c in commits %}{% if not c.scope or c.scope is not matching("^[A-Z]+-[0-9]+$") %}{% set_global other = other | concat(with=c) %}{% endif %}{% endfor %}{% if other | length > 0 %}
### Other
{% for c in other %}- {{ c.group }}{% if c.scope %}({{ c.scope }}){% endif %}: {{ c.message | upper_first }}
{% endfor %}{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
sort_commits = "oldest"
# task ID -> scope, with leading zeros for the order APP-7 before APP-11 (without zeros in the text)
commit_preprocessors = [
  { pattern = '^(\w+)\(([^)]*)\)(!?): ([A-Z]+-[0-9]+) ', replace = '${1}(${4})${3}: (${2}) ' },
  { pattern = '^(\w+)(!?): ([A-Z]+-[0-9]+) ', replace = '${1}(${3})${2}: ' },
  { pattern = '^(\w+)\(([A-Z]+-)([0-9])\)', replace = '${1}(${2}00000${3})' },
  { pattern = '^(\w+)\(([A-Z]+-)([0-9]{2})\)', replace = '${1}(${2}0000${3})' },
  { pattern = '^(\w+)\(([A-Z]+-)([0-9]{3})\)', replace = '${1}(${2}000${3})' },
  { pattern = '^(\w+)\(([A-Z]+-)([0-9]{4})\)', replace = '${1}(${2}00${3})' },
  { pattern = '^(\w+)\(([A-Z]+-)([0-9]{5})\)', replace = '${1}(${2}0${3})' },
]
commit_parsers = [
  { message = "^wip", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(\\w+)", group = "$1" },
]
