# Production deployment (GIT_STRATEGY_EN.md sections 13, 19): never starts by itself.
# Run by a human ("Run workflow") or by an agent with production permission:
#   gh workflow run deploy-prod.yml -f tag=vX.Y.Z
# For this desktop app it publishes the draft GitHub Release with the signed MSIX (scripts/ci/deploy.ps1).
name: deploy-prod
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true

jobs:
  deploy:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag }}" }
      - run: ./scripts/ci/deploy.ps1 prod
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
