# Pull Request title and target branch rules (GIT_STRATEGY_EN.md sections 5, 6, 10, 12).
# Git and shell logic only: cheapest runner (ubuntu), nothing installed. The logic is in scripts/ci/check-pr-rules.sh.
# `edited` is here (not in ci.yml): fixing a title or retargeting the base re-checks the rules.
name: pr-rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: { contents: read }

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/ci/check-pr-rules-test.sh
      - run: sh scripts/ci/check-pr-rules.sh "$HEAD_REF" "$BASE_REF" "$TITLE"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
      - run: sh scripts/ci/check-attribution.sh text
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}

  # A red `rules` stops the unfinished ci.yml run of the same PR (the long Windows job), scripts/ci/stop-ci-run.sh.
  # Own job, so only it gets `actions: write`. Not for fork PRs (their token cannot cancel). The rules job stays red, the cancelled run is grey.
  stop-ci:
    needs: rules
    if: ${{ always() && needs.rules.result == 'failure' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/ci/stop-ci-run.sh rules "$PR" "$HEAD_SHA"
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
