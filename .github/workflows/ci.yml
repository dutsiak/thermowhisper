# CI by GIT_STRATEGY_EN.md sections 13 and 19 (GitHub Actions template, adapted for a Windows MAUI app).
# All logic is in scripts/ci/ and scripts/release/; this file only says when and where to run them.
# dev/stage "deploy" = build the MSIX and attach it to the workflow run as an artifact (job deploy).
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev, stage, 'release/**', 'chore/Release-v*']
    tags: ['v*']
  workflow_dispatch:

# One run per PR: a new push cancels the older run. Pushes to permanent branches, tags and
# workflow_dispatch get their own group (run_id) and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  git-checks:                       # git logic: ubuntu, nothing installed; a failure here stops Windows from starting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: sh scripts/ci/check-authors.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
      - run: sh scripts/ci/check-base.sh "$BASE" "$HEAD_REF" "$HEAD_SHA"
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: sh scripts/ci/check-commit-ids.sh "$BASE" "$HEAD_REF" "$HEAD_SHA"
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: github.base_ref == 'stage' || github.base_ref == 'main'
        run: sh scripts/ci/check-promoted.sh "$BASE" "$HEAD_REF" "$HEAD_SHA"
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check:                            # Windows + MAUI tools: only here
    needs: git-checks
    # git-checks is skipped on push, so: not cancelled and not failed (the default "all needs succeeded" would skip this job).
    if: ${{ !cancelled() && needs.git-checks.result != 'failure' && !startsWith(github.ref_name, 'chore/Release-v') }}
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: ./.github/actions/setup-build
      - run: ./scripts/ci/lint.ps1
      - run: ./scripts/ci/test.ps1

  review:
    # Fork PRs get no secrets, so the reviewer runs only for branches of this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'main' && (github.base_ref == 'dev' || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'chore/Merge-'))
    needs: [git-checks, check]
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The same head is reviewed once: the comment ends with a marker that a re-run or a reopened PR finds.
      - id: seen
        run: bash scripts/ci/review-seen.sh "$PR" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.seen.outputs.skip != 'true'
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
        env:
          CLAUDE_CODE_VERSION: '2.1.316'   # the only place of the Claude Code version (git-cliff: scripts/versions.env)
      - if: steps.seen.outputs.skip != 'true'
        run: bash scripts/ci/review-rulings.sh "$PR" > rulings.txt
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.seen.outputs.skip != 'true'
        run: |
          bash scripts/ci/review.sh "origin/$BASE" "$TITLE" rulings.txt > review.md
          printf '\n<!-- reviewed: %s -->\n' "$HEAD_SHA" >> review.md
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: steps.seen.outputs.skip != 'true'
        run: gh pr comment "$PR" --body-file review.md
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  prepare-release:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'chore/Release-v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/release/prepare-release.sh
          git push

  deploy:
    # Every push to dev or stage: build the MSIX and keep it as a workflow-run artifact
    # (Actions -> the run -> Artifacts). Not a GitHub Release: extra tags would break release-notes.sh.
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'stage') }}
    needs: check
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}-${{ github.run_number }}
      UNSIGNED_TEST: 'true'   # installable unsigned test build, docs/architecture.md section 10
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: ./.github/actions/setup-build
      - run: ./scripts/ci/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: ThermoWhisper-${{ env.TAG }}-unsigned-test
          path: dist/*.msix
          retention-days: 30
          if-no-files-found: error

  release:
    # Tag vX.Y.Z: build the MSIX, sign it with SignPath (when configured), create a DRAFT release.
    # Publishing the draft = production deployment, manual only: workflow deploy-prod.
    if: ${{ !cancelled() && needs.check.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: check
    runs-on: windows-latest
    permissions: { contents: write, actions: read }
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, lfs: true }
      - uses: ./.github/actions/setup-build
      - run: ./scripts/ci/build.ps1
        id: build
        shell: pwsh
      - name: Upload unsigned MSIX
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.msix }}
          archive: false
          if-no-files-found: error
      - name: Sign with SignPath
        # Pre-1.0 tags (v0.x.y) are unsigned test packages (build.ps1) and are not signed.
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && steps.build.outputs.unsigned_test != 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MSIX: ${{ steps.build.outputs.msix }}
        run: sh scripts/release/create-draft-release.sh "$TAG" "$MSIX"
